# Render Blueprint — deploys the API and a managed PostgreSQL instance.
#
#   1. Push this repository to GitHub.
#   2. Render dashboard -> New -> Blueprint -> pick the repo.
#   3. Render reads this file and creates both services.
#
# SECRET_KEY is generated by Render and never stored in this file.
# SEMANTIC_SCHOLAR_API_KEY is marked sync:false — set it in the dashboard
# (Environment tab) so it never reaches Git.
services:
  - type: web
    name: paperswipe-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /health
    # Migrate and seed before the new instance starts taking traffic.
    preDeployCommand: "alembic upgrade head && python -m app.scripts.seed"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: paperswipe-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: CORS_ORIGINS
        # Expo apps send no browser Origin, so this can stay tight.
        # Add real web origins here if you ship an `expo start --web` build.
        value: "https://paperswipe.example.com"
      - key: SEMANTIC_SCHOLAR_API_KEY
        sync: false

databases:
  - name: paperswipe-db
    databaseName: paperswipe
    user: paperswipe
    plan: basic-256mb
