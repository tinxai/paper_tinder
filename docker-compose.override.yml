# Local development overrides. Docker Compose loads this automatically on top
# of docker-compose.yml, so `docker compose up` gives you live reload.
#
# It is intentionally NOT used in production: deployments run the plain
# docker-compose.yml (or the Dockerfile directly on Render/Railway).
# To ignore it explicitly:
#   docker compose -f docker-compose.yml up -d
services:
  api:
    # Bind-mount the source so edits take effect without rebuilding the image.
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/alembic:/app/alembic:ro
    environment:
      DEBUG: "true"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.scripts.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /app/app"
